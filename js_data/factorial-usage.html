<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>


    <h1 class="text-4xl mt-10 text-center font-bold">
        Probability Calculator ( <sup>n</sup> C <sub>r</sub> and  <sup>n</sup> P <sub>r</sub>)
    </h1>

    <section class="bg-blue-100 w-fit min-h-20 mx-auto my-10 p-6">
        <div>
            <input 
                type="text" 
                placeholder="Enter the value of N" 
                id="n-data"
                class="bg-white text-black border border-slate-400 mb-3 h-8 px-3"
            >
        </div>

        <div>
            <input 
                type="text" 
                placeholder="Enter the value of R" 
                id="r-data"
                class="bg-white text-black border border-slate-400 mb-3 h-8 px-3"
            >
        </div>
        <div>
            <select 
                id="calculate-option"
                class="bg-white text-black border border-slate-400 mb-3 h-8 px-3 w-full" 
            >
                <option value="permutatation">Permutation</option>
                <option value="combination">Combination</option>
            </select>
        </div>
        <div>
            <button onclick="calculate()" class="py-1 px-3 rounded-sm bg-blue-500 text-white">
                Calculate
            </button>
        </div>
        <div>
            <span id="span-result"></span>
        </div>
    </section>


    <script>
        /**
         * ============== ES5 (OLD) Methods ==========
         * ==== Syntax ====
         * function methodName ([parameters]){
         *      Statements;
         * }
         * 
         * ============= ES6+ (MODERN) Methods =======
         * [let/const] methodName = ([parameters]) => {
         *      Statements;
         * }
         * 
         * 
         * ===========================================
         * Parameters: These are variables that are decleared with the method(function) definition header.
         * The are used to recieve external data into the method(function) through Arguments.
         * 
         * Argument: An  Argument is simply the value/data that is passed into a function when it is invoked(called)
         * 
         * Method Invokation is simply the process of calling a method in other for it to perform its predefined task.
         * That Means: A method must be called before it performs it function.
        */

        function greet() {
            alert("Hello to all of you in this class!");
        }
        // greet();

        function greetSomebody(person) {
            alert(`${person}, You are welcome to this class.`);
        }
        // greetSomebody("Micheal")

        function factorialOf(number) {
            let factorial = 1;

            for (i = 1; i <= number; i++) {
                factorial = factorial * i;
            }

            return factorial;
        }

        // console.log(factorialOf(9))
        // alert(factorialOf(6))

        // // Solving 5 combination 3 (5C3)
        // let comb;
        // comb = factorialOf(5)/(factorialOf(5 - 3) * factorialOf(3));
        // console.log(`The result of 5 Combination 3 is ${comb}`);
        
        // // Solving 5 Permutation 3 (5P3)
        // let perm;
        // perm = factorialOf(5)/factorialOf(5 - 3);
        // console.log(`The result of 5 Permutation 3 is ${perm}`);

        function calculate(){
            let valueOfN = document.getElementById('n-data').value;
            let valueOfR = document.getElementById('r-data').value;
            let option = document.getElementById('calculate-option').value
            let resultSpan = document.getElementById('span-result')

            // Validate the input field for N and R values
            if (valueOfN == '' || valueOfR == '') {
                alert("Error! The value of N and R must not be empty")
                return;
            }

            // console.log(valueOfN, valueOfR, option);
            if (option == 'permutatation') {
                // Calculate Permutation
                perm = factorialOf(valueOfN)/factorialOf(valueOfN - valueOfR);
                // console.log(`The result is ${perm}`);
                resultSpan.innerText = `The result is ${perm}`;
            }else{
                // Calculate Combination
                comb = factorialOf(valueOfN)/(factorialOf(valueOfN - valueOfR) * factorialOf(valueOfR));
                // console.log(`The result is ${comb}`);
                resultSpan.innerText = `The result is ${comb}`;
            }
            
        }



    </script>
</body>

</html>
