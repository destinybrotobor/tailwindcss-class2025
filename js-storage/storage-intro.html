<!DOCTYPE html>
<html lang="en" class="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to Storage</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../assets/fa/css/all.min.css">
    <script>
        // Usage of the localStorage to store the theme preference of the user
        let currentTheme = localStorage.getItem('theme');

        if (currentTheme == 'dark' || (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.add('light')
        }
    </script>
</head>

<body class="bg-slate-100 dark:bg-slate-950">

    <h1 class="text-7xl font-bold text-slate-800 dark:text-slate-200 text-center mt-10">
        Welcome To Storage Class
    </h1>

    <section class="flex items-center justify-between mt-10 max-w-6xl mx-auto">
        <div class="max-w-1/2">
            <input type="text" placeholder="Search for a product" class="w-full h-8 px-3 border border-slate-300">
        </div>
        <button class="bg-blue-500 text-white py-1 px-3 rounded-lg" onclick="toggleModal('open')">
            Add Product
        </button>

    </section>

    <div class="fixed top-50 -right-30 flex flex-col items-start gap-2 bg-white shadow">
        <!-- <button class="py-2 px-4 bg-white shadow" onclick="toogleDarkMode()">
            Toggle Dark Mode
        </button> -->
        <button class="py-2 px-4" onclick="toogleWebsiteTheme('light')">
            <i class="fa-solid fa-sun text-yellow-500 text-2xl"></i> Light Mode
        </button>
        <button class="py-2 px-4" onclick="toogleWebsiteTheme('dark')">
            <i class="fa-solid fa-moon text-gray-500 text-2xl"></i> Dark Mode
        </button>
        <button class="py-2 px-4" onclick="toogleWebsiteTheme('system')">
            <i class="fa-solid fa-desktop text-2xl"></i> System Theme
        </button>
    </div>

    <!-- Product List -->
    <section class=" min-h-30 mt-10">
        <aside id="product-list"
            class="max-w-6xl mx-auto w-full py-4 px-6 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-3 gap-y-6">
            <!-- Cards will be loaded from JavaScript -->
        </aside>
    </section>

    <!-- Overlay Section -->
    <section id="modal"
        class="fixed left-0 top-0 bg-black/50 backdrop-blur z-50 w-full h-screen items-center justify-center hidden"
    >
        <div class="bg-white w-xl min-h-30 shadow rounded-lg max-h-80vh overflow-y-auto">
            <header class="flex justify-between items-center py-2 px-4 border-b border-slate-300">
                <h1 class="py-1 text-lg font-bold">Add Product</h1>
                <button onclick="toggleModal('close')">
                    <i class="fa-solid fa-times-circle text-red-500 fa-2xl"></i>
                </button>
            </header>
            <main class="py-2 px-6">
                <form id="add-product-form" class="pb-5">
                    <div class="mt-4">
                        <label for="image" class="block text-sm font-medium text-gray-700">Image URL</label>
                        <input type="text" id="image" name="image"
                            class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-indigo-500 focus:border-indigo-500"
                            required>
                    </div>
                    <div class="mt-4">
                        <label for="product-name" class="block text-sm font-medium text-gray-700">Product Name</label>
                        <input type="text" id="product-name" name="product-name"
                            class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-indigo-500 focus:border-indigo-500"
                            required>
                    </div>
                    <div class="mt-4">
                        <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                        <textarea id="description" name="description"
                            class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-indigo-500 focus:border-indigo-500"
                            required></textarea>
                    </div>
                    <div class="mt-4">
                        <label for="price" class="block text-sm font-medium text-gray-700">Price</label>
                        <input type="number" id="price" name="price"
                            class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring focus:ring-indigo-500 focus:border-indigo-500"
                            required>
                    </div>
                    <div class="flex justify-end mt-4">
                        <button type="submit"
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Add
                            Product</button>
                    </div>
                </form>
            </main>
        </div>
    </section>
    <script src="./../js/product-store.js"></script>


    <script>
        // let fullname, email, phone, address;
        // fullname = prompt("Enter your full name:");
        // email = prompt("Enter your email:");
        // phone = prompt("Enter your phone number:");
        // address = prompt("Enter your address:");

        // {
        //     key: "value"
        // }

        // localStorage.setItem("fullname", fullname);
        // localStorage.setItem("email", email);
        // localStorage.setItem("phone", phone);
        // localStorage.setItem("address", address);

        // // Print the details n stored in localStorage
        // console.log("Full Name: " + localStorage.getItem("fullname"));
        // console.log("Email: " + localStorage.getItem("email")); 
        // console.log("Phone: " + localStorage.getItem("phone"));
        // console.log("Address: " + localStorage.getItem("address"));


        // Toggle and store the theme preference of the user using localStorage

        let toogleDarkMode = () => {
            let isDarkMode = document.documentElement.classList.contains("dark");

            if (isDarkMode) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light')
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark')
            }
        }

        let toogleWebsiteTheme = (theme) => {
            if (theme == 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
                localStorage.setItem('theme', 'light')
            } else if (theme == 'dark') {
                document.documentElement.classList.remove('light');
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark')
            } else {
                localStorage.removeItem('theme')
                location.reload();
            }
        }

        // Add Event Listener to Product form
        let productForm = document.getElementById('add-product-form');

        productForm.addEventListener('submit', (ev) => {
            ev.preventDefault();
            let form = ev.target;

            let product = {
                imageUrl: form.image.value,
                name: form['product-name'].value,
                description: form.description.value,
                price: form.price.value
            }

            // products.push(product);
            storeNewProduct(product);
            displayProducts(fetchFromStorage());
            form.reset();
            toggleModal('close')
        })

        let toggleModal = (state = 'close') => {
            let modalElement = document.getElementById('modal');

            if (state == 'open') {
                modalElement.classList.remove('hidden');
                modalElement.classList.add('flex');
            }else{
                modalElement.classList.add('hidden');
                modalElement.classList.remove('flex');
            }
        }



        // Function to populate the products
        let displayProducts = (productList) => {
            let list = '';
            let productListElement = document.getElementById('product-list');

            productList.forEach((product, index) => {
                console.log(product);

                list += `<div class="bg-white hover:shadow min-h-30 rounded-xl overflow-hidden">
                <section class="bg-slate-400 flex justify-center items-center w-full h-35 hover:scale-105 transition duration-300">
                    <img src="${product.imageUrl}" alt="${product.name}" class="w-full h-full object-cover">
                </section>
                <section class="py-3 px-4">
                    <h1 class="text-lg font-medium line-clamp-1">${product.name}</h1>
                    <p class="line-clamp-2 text-sm text-gray-500 mt-1 mb-3">${product.description}</p>
                    <p class="mb-2">
                        <span class="font-bold text-lg text-green-500">₦ ${product.price}</span>
                    </p>
                    <div>
                        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                            <i class="fa-solid fa-cart-shopping text-white"></i> Add To Cart
                        </button>
                    </div>
                </section>
            </div>`;
            });

            productListElement.innerHTML = list;
        }
        displayProducts(fetchFromStorage());





    </script>
</body>

</html>
